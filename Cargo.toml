[workspace]
resolver = "2"
members = [
    "crates/mister-smith-core",
    "crates/mister-smith-config",
    "crates/mister-smith-runtime",
    "crates/mister-smith-monitoring",
    "crates/mister-smith-events",
    "crates/mister-smith-async",
    "crates/mister-smith-resources",
    "crates/mister-smith-actor",
    "crates/mister-smith-supervision",
    "crates/mister-smith-transport",
    "crates/mister-smith-nats",
    "crates/mister-smith-http",
    "crates/mister-smith-grpc",
    "crates/mister-smith-mcp",
    "crates/mister-smith-llm",
    "crates/mister-smith-security",
    "crates/mister-smith-persistence",
    "crates/mister-smith-agents",
    "crates/mister-smith-integration-tests",
    "crates/mister-smith-app",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthewmaggio/mister-smith"

[workspace.dependencies]
# Serialization
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Identity
uuid = { version = "1.22.0", features = ["v4", "serde"] }

# Async
async-trait = "0.1.83"
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Versioning
semver = "1.0"

# Config
toml = "1.0"

# Logging / Metrics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"

# Concurrency
crossbeam = "0.8"
parking_lot = "0.12.3"
dashmap = "6.1.0"
petgraph = "0.8.3"

# System
num_cpus = "1.16"

# Transport — Phase 4
bytes = "1"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rmp-serde = "1.3.1"
serde_bytes = "0.11"
async-nats = { version = "0.46.0", features = ["jetstream", "kv", "service"] }
axum = { version = "0.8.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-build = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"

# Persistence — Phase 6
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "json", "chrono", "migrate"] }

# Security — Phase 5
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
jsonschema = { version = "0.45.0", default-features = false }
ring = "=0.17.14"
ipnet = "2.11.0"
rustls = "0.23.37"
tokio-rustls = "0.26.4"
rcgen = { version = "0.14.7", features = ["pem"] }
rustls-pki-types = "1"
sha2 = "0.10"
arc-swap = "1"
hex = "0.4"
base64 = "0.22.1"
nats-jwt = "0.3.0"
nkeys = "0.4.5"

# Internal crates
mister-smith-core = { path = "crates/mister-smith-core" }
mister-smith-config = { path = "crates/mister-smith-config" }
mister-smith-runtime = { path = "crates/mister-smith-runtime" }
mister-smith-monitoring = { path = "crates/mister-smith-monitoring" }
mister-smith-events = { path = "crates/mister-smith-events" }
mister-smith-async = { path = "crates/mister-smith-async" }
mister-smith-resources = { path = "crates/mister-smith-resources" }
mister-smith-actor = { path = "crates/mister-smith-actor" }
mister-smith-supervision = { path = "crates/mister-smith-supervision" }
mister-smith-transport = { path = "crates/mister-smith-transport" }
mister-smith-nats = { path = "crates/mister-smith-nats" }
mister-smith-http = { path = "crates/mister-smith-http" }
mister-smith-grpc = { path = "crates/mister-smith-grpc" }
mister-smith-mcp = { path = "crates/mister-smith-mcp" }
mister-smith-llm = { path = "crates/mister-smith-llm" }
mister-smith-security = { path = "crates/mister-smith-security" }
mister-smith-persistence = { path = "crates/mister-smith-persistence" }
mister-smith-agents = { path = "crates/mister-smith-agents" }

# Observability — Phase 8
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.1", features = ["tonic"] }
tracing-opentelemetry = "0.32.1"

# CLI — Phase 8
clap = { version = "4", features = ["derive"] }
webbrowser = "1.2.0"
