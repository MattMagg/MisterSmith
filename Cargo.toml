[workspace]
resolver = "2"
members = [
    "crates/mister-smith-core",
    "crates/mister-smith-config",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthewmaggio/mister-smith"

[workspace.dependencies]
thiserror = "1.0.69"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
async-trait = "0.1.83"
semver = "1.0"
toml = "0.8"
