name: Workflow / CI issue
description: Report a broken GitHub workflow, automation path, or release process.
title: "[Workflow] "
labels: []
body:
  - type: input
    id: workflow
    attributes:
      label: Workflow name
      description: Name of the failing or incorrect workflow.
      placeholder: CI, Claude Code Review, documentation-validation
    validations:
      required: true
  - type: input
    id: run_url
    attributes:
      label: Run URL
      description: Link the failing run, job, or PR if one exists.
      placeholder: https://github.com/MattMagg/MisterSmith/actions/runs/...
    validations:
      required: false
  - type: textarea
    id: failure
    attributes:
      label: Failure summary
      description: Describe the bad behavior or failure mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or trigger
      description: Explain when the workflow fails.
      placeholder: Push to main, open a PR, trigger workflow_dispatch, comment @claude
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected files or systems
      description: List the workflow files, scripts, or external systems involved.
      placeholder: .github/workflows/ci.yml, scripts/run-symphony.sh, GitHub Actions secrets
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define what fixed looks like.
    validations:
      required: true
