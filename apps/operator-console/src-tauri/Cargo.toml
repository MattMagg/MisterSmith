[package]
name = "operator-console"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "operator_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2" }
tauri-plugin-websocket = { version = "2" }
mister-smith-app = { path = "../../../crates/mister-smith-app" }
mister-smith-llm = { path = "../../../crates/mister-smith-llm" }

[workspace]
