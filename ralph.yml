# Ralph Orchestrator Configuration
# Generated by: ralph init --backend codex
# Docs: https://github.com/mikeyobrien/ralph-orchestrator
#
# Thin loop configuration only.
# Default full SpecKit workflow:
#   ralph run -c ralph.yml
#
# Optional Ralph-native workflows remain available when explicitly desired:
#   ralph run -c ralph.yml -H builtin:code-assist
#   ralph run -c ralph.yml -H builtin:feature

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 100
  max_runtime_seconds: 14400
  checkpoint_interval: 5

core:
  scratchpad: ".ralph/agent/scratchpad.md"
  specs_dir: "./specs/"

# ─────────────────────────────────────────────────────────────────────────────
# Additional Configuration (uncomment to customize)
# ─────────────────────────────────────────────────────────────────────────────
# Create or update PROMPT.md with your task, then run Ralph. PROMPT.md should
# instruct Codex to follow the repo's full SpecKit sequence rather than a
# Ralph-defined substitute workflow.
