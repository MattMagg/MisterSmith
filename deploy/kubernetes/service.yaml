apiVersion: v1
kind: Service
metadata:
  name: mister-smith
  namespace: mister-smith
  labels:
    app.kubernetes.io/name: mister-smith
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mister-smith
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
