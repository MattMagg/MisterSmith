# Local development stack for Mister Smith framework.
# Usage: docker compose -f deploy/docker-compose.yml up -d

services:
  nats:
    image: nats:2.12.4-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--store_dir=/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/varz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mistersmith
      POSTGRES_USER: mistersmith
      POSTGRES_PASSWORD: mistersmith_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mistersmith"]
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - grafana

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards

  mister-smith:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      MISTER_SMITH_NATS_URL: nats://nats:4222
      MISTER_SMITH_DATABASE_URL: postgres://mistersmith:mistersmith_dev@postgres:5432/mistersmith
      MISTER_SMITH_OTLP_ENDPOINT: http://otel-collector:4317
      MISTER_SMITH_LOG_LEVEL: info
      MISTER_SMITH_LOG_FORMAT: json
      MISTER_SMITH_HTTP_PORT: "8080"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  nats-data:
  postgres-data:
  grafana-data:
