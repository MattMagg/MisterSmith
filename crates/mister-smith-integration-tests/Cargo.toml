[package]
name = "mister-smith-integration-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-crate integration tests for Phase 2"
publish = false

[dependencies]
mister-smith-core = { workspace = true }
mister-smith-config = { workspace = true }
mister-smith-runtime = { workspace = true }
mister-smith-monitoring = { workspace = true }
mister-smith-events = { workspace = true }
mister-smith-async = { workspace = true }
mister-smith-resources = { workspace = true }
mister-smith-actor = { workspace = true }
mister-smith-supervision = { workspace = true }
mister-smith-transport = { workspace = true }
mister-smith-nats = { workspace = true }
mister-smith-http = { workspace = true }
mister-smith-grpc = { workspace = true }
mister-smith-mcp = { workspace = true }
mister-smith-security = { workspace = true }
mister-smith-agents = { workspace = true }
mister-smith-persistence = { workspace = true, optional = true, features = ["sqlx", "security"] }
tokio = { workspace = true, features = ["test-util"] }
axum = { workspace = true }
tower = { workspace = true }
tempfile = "3"
serde_json = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
chrono = { workspace = true }
async-nats = { workspace = true }
toml = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = "0.28"
sqlx = { workspace = true }

[features]
default = ["persistence"]
persistence = ["dep:mister-smith-persistence"]
