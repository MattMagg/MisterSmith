[package]
name = "mister-smith-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP REST API and WebSocket transport using Axum"

[features]
default = ["security"]
security = ["dep:mister-smith-security"]

[dependencies]
mister-smith-core = { workspace = true }
mister-smith-transport = { workspace = true }
mister-smith-monitoring = { workspace = true }
mister-smith-security = { workspace = true, optional = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
