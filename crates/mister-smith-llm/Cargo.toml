[package]
name = "mister-smith-llm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral LLM contract, shared types, and deterministic mock provider"

[features]
default = []
anthropic = ["dep:reqwest"]
claude-subscription = ["dep:reqwest"]
openai = ["dep:reqwest"]
openai-chatgpt = []
all-providers = ["anthropic", "claude-subscription", "openai", "openai-chatgpt"]

[dependencies]
mister-smith-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
axum = { workspace = true }
