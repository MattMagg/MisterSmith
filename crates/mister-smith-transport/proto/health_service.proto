// Health Service — standard gRPC health checking (Kubernetes-compatible).
// Spec reference: FR-014, FR-019, US5 acceptance scenario 4
// Phase 4: Transport & Messaging
//
// Follows the gRPC Health Checking Protocol:
// https://github.com/grpc/grpc/blob/master/doc/health-checking.md

syntax = "proto3";

package grpc.health.v1;

message HealthCheckRequest {
  // Service name to check. Empty string = overall server health.
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  // Unary health check — Kubernetes readiness/liveness probe compatible
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  // Streaming health watch — receives updates when health status changes
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
